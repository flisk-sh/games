[vars]
PUBLIC_ORIGIN = "https://games.flisk.si"
LOGIN_ORIGIN = "https://login.flisk.si"
LOGIN_PUBLIC_KEY = "g_3cGlqaMDf4mM4Bgfv8EO6js7yW_bcSW7cOUpSwLc0"
