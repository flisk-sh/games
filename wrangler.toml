name = "flisk-games"
main = "src/index.js"
compatibility_date = "2026-11-01"

routes = [{ pattern = "games.flisk.si", custom_domain = true }]

[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/auth/*", "/api/*"]

[[kv_namespaces]]
binding = "SESSIONS"
id = "d9cba4e151fd4952a43678455b24e33b"

